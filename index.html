<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <!-- Left Side - Illustration -->
            <div class="login-illustration">
                <div class="illustration-content">
                    <div class="shield-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1>Welcome Back!</h1>
                    <p>Secure your digital world with us</p>
                    <div class="features">
                        <span><i class="fas fa-check-circle"></i> Secure Connection</span>
                        <span><i class="fas fa-check-circle"></i> 2FA Ready</span>
                        <span><i class="fas fa-check-circle"></i> Encrypted Data</span>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="login-form">
                <div class="form-header">
                    <div class="logo">
                        <i class="fas fa-lock"></i>
                        <span>SecureAuth</span>
                    </div>
                    <h2>Sign In</h2>
                    <p class="subtitle">Enter your credentials to access your account</p>
                </div>

                <form id="loginForm" novalidate>
                    <!-- Email Field -->
                    <div class="input-group">
                        <div class="input-field">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder=" " autocomplete="email" required>
                            <label for="email">Email Address</label>
                            <div class="input-border"></div>
                        </div>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <div class="input-field">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder=" " autocomplete="current-password" required minlength="8">
                            <label for="password">Password</label>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                            <div class="input-border"></div>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <!-- Options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-loader" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>

                    <!-- Register Link -->
                    <div class="register-link">
                        Don't have an account? <a href="#">Create one</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="toast-content">
            <h4>Success</h4>
            <p>Login successful! Redirecting...</p>
        </div>
        <button class="toast-close">&times;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
